{% extends 'base.html' %}

{% block title %}CRS - Solicitar Alçada{% endblock %}

{% block extra_css %}
<link href="{{ url_for('solicitar_alcada.static', filename='css/solicitar_alcada.css') }}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="pagetitle mb-4">
  <h1 class="pagetitle-main">Solicitar Alçada</h1>
</div>

<div class="card p-4 mb-4">
  <form id="formSolicitarAlcada" method="POST" action="{{ url_for('solicitar_alcada.solicitar_alcada') }}" class="needs-validation">
    <div class="row align-items-end g-3">
      <div class="col-md-4 col-lg-4">
        <label for="selectGrupoEconomico" class="form-label">Grupo Econômico</label>
        <select class="form-select" id="selectGrupoEconomico" name="dsGrupo" required onchange="this.form.action.value='atualizar_grupos'; this.form.submit();">
          <option value="" disabled {% if not grupo_selecionado %}selected{% endif %}>Selecione um grupo econômico...
          </option>
          {% for item in grupos_cadastrados %}
          {% set grupo_nome = item.dsGrupo if item.dsGrupo is defined else item %}
          <option value="{{ grupo_nome }}" {% if grupo_selecionado==grupo_nome %}selected{% endif %}>{{ grupo_nome }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-5 col-lg-6">
        <label for="selectTipoEvento" class="form-label">Evento</label>
        <select class="form-select" id="selectTipoEvento" name="evento_selecionado" required {% if not grupo_selecionado %}disabled{% endif %}>
          {% if not grupo_selecionado %}
          <option value="" disabled selected>Selecione um grupo econômico primeiro...</option>
          {% else %}
          <option value="" disabled {% if not evento_selecionado %}selected{% endif %}>Selecione um evento...
          </option>
          {% for ev in eventos_cadastrados %}
          {% set ev_nome = ev.get('dsTipoEvento') or ev.get('dsEvento') or ev.get('nome') or ev %}
          <option value="{{ ev_nome }}" {% if evento_selecionado and evento_selecionado == ev_nome %}selected{% endif %}>{{ ev_nome }}</option>
          {% endfor %}
          {% endif %}
        </select>
      </div>
      <div class="col-md-3 col-lg-2">
        <input type="hidden" name="action" value="iniciar_formulario">
        <button type="submit" id="btnIniciarSolicitacao" class="btn-orange w-100 py-2 d-flex align-items-center justify-content-center gap-2" onclick="this.form.action.value='iniciar_formulario';">
          <i class="bi bi-play-circle"></i> Iniciar
        </button>
      </div>
    </div>
  </form>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('solicitar_alcada.static', filename='js/solicitar_alcada.js') }}"></script>
{% endblock %}
