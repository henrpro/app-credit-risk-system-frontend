{% extends 'base.html' %}

{% block title %}CRS - Consultar Grupo Econômico{% endblock %}

{% block content %}
<div class="pagetitle mb-4">
  <h1 class="pagetitle-main">Consultar Grupo Econômico</h1>
</div>

<div class="card p-4">
  <form id="formConsultarGrupo" method="POST" class="needs-validation">
    <div class="row align-items-end g-3">
      <div class="col-md-8 col-lg-6">
        <label for="selectGrupoEconomico" class="form-label">Grupo Econômico</label>
        <select class="form-select" id="selectGrupoEconomico" name="dsGrupo" required>
          <option value="" disabled selected>Selecione um grupo econômico...</option>
          {% for item in grupos_cadastrados %}
            {% set grupo_nome = item.dsGrupo if item.dsGrupo is defined else item %}
            <option value="{{ grupo_nome }}">{{ grupo_nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4 col-lg-3">
        <button type="submit" id="btnPesquisarGrupo" class="btn-orange w-100 py-2 d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-search"></i> Pesquisar
        </button>
      </div>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('grupos_economicos.static', filename='css/grupos_economicos.css') }}">
{% endblock %}
