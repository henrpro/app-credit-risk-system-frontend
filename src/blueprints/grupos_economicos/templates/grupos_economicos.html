{% extends "base.html" %}

{% block title %}Grupos Econômicos - Credit Risk System{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <h1 class="pagetitle-main">Grupos Econômicos</h1>
        </div>
    </div>

    <!-- Abas -->
    <div class="row mt-1">
        <div class="col-12">
            <ul class="nav nav-tabs" id="gruposTab" role="tablist" style="border-bottom: 1px solid var(--color-border);">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="cadastrar-tab" data-bs-toggle="tab" data-bs-target="#cadastrar" type="button" role="tab" aria-controls="cadastrar" aria-selected="true" style="color: var(--color-text-main); font-weight: 600; border-color: var(--color-border) var(--color-border) transparent;">Cadastrar Novo Grupo Econômico</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="visualizar-tab" data-bs-toggle="tab" data-bs-target="#visualizar" type="button" role="tab" aria-controls="visualizar" aria-selected="false" style="color: var(--color-text-muted); font-weight: 600;">Visualizar Grupo Econômico</button>
                </li>
            </ul>

            <div class="tab-content" id="gruposTabContent" style="padding-top: 12px;">
                <!-- Aba 1: Cadastrar Novo Grupo -->
                <div class="tab-pane fade show active" id="cadastrar" role="tabpanel" aria-labelledby="cadastrar-tab">
                    <div class="card border-0 shadow-sm" style="background-color: var(--color-bg-secondary); border-radius: 12px;">
                        <div class="card-body p-4">
                            <form id="formCadastrarGrupo" class="needs-validation" novalidate>
                                <div class="row align-items-end">
                                    <div class="col-md-6 mb-3">
                                        <label for="nomeGrupo" class="form-label" style="font-family: 'ItauText', sans-serif; font-weight: bold; font-size: 17px;">Nome do Grupo Econômico <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="nomeGrupo" name="nomeGrupo" placeholder="Ex: Grupo Itaúsa" style="font-family: 'ItauText', sans-serif; background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-main); font-size: 14px;" required>
                                        <div class="invalid-feedback" style="font-size: 13px;">
                                            Por favor, insira o nome do grupo econômico.
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <button type="button" id="btnAdicionarEmissor" class="btn-associar">
                                            <i class="bi bi-plus-circle"></i> Adicionar Emissor
                                        </button>
                                    </div>
                                </div>

                                <!-- Container para os novos emissores -->
                                <div id="emissoresContainer"></div>

                                <div class="row mt-4">
                                    <div class="col-12 text-center">
                                        <button type="submit" class="btn" style="background-color: var(--color-accent); color: white; font-family: 'ItauText', sans-serif; font-weight: 700; padding: 10px 32px; border-radius: 8px;">
                                            <i class="bi bi-check-circle me-2"></i> Cadastrar Grupo Econômico
                                        </button>
                                    </div>
                                </div>
                            </form>

                            <!-- Template oculto para os blocos de emissor -->
                            <template id="emissorTemplate">
                                <div class="emissor-block p-4 mb-4 mt-3" style="background-color: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: 8px; position: relative;">
                                    <button type="button" class="btn btn-sm text-danger remove-emissor-btn" style="position: absolute; top: 10px; right: 10px; font-size: 18px;" title="Remover Emissor">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                    
                                    <h6 style="font-family: 'ItauText', sans-serif; font-weight: bold; color: var(--color-accent); font-size: 19px; margin-bottom: 20px;">Detalhes do Emissor</h6>
                                    
                                    <!-- Linha 1 -->
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label" style="font-family: 'ItauText', sans-serif; font-weight: bold; font-size: 17px;">Nome do Emissor <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" name="nomeEmissor[]" style="font-family: 'ItauText', sans-serif; background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-main); font-size: 14px;" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" style="font-family: 'ItauText', sans-serif; font-weight: bold; font-size: 17px;">CNPJ <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control cnpj-mask" name="cnpjEmissor[]" maxlength="18" placeholder="00.000.000/0000-00" style="font-family: 'ItauText', sans-serif; background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-main); font-size: 14px;" required>
                                        </div>
                                    </div>

                                    <!-- Linha 2 -->
                                    <div class="row mb-4">
                                        <div class="col-md-4">
                                            <label class="form-label" style="font-family: 'ItauText', sans-serif; font-weight: bold; font-size: 17px;">É Holding? <span class="text-danger">*</span></label>
                                            <select class="form-control" name="isHolding[]" style="font-family: 'ItauText', sans-serif; background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-main); font-size: 14px;" required>
                                                <option value="">Selecione...</option>
                                                <option value="nao">Não</option>
                                                <option value="sim">Sim</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label" style="font-family: 'ItauText', sans-serif; font-weight: bold; font-size: 17px;">Consome da Holding? <span class="text-danger">*</span></label>
                                            <select class="form-control" name="consomeHolding[]" style="font-family: 'ItauText', sans-serif; background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-main); font-size: 14px;" required>
                                                <option value="">Selecione...</option>
                                                <option value="nao">Não</option>
                                                <option value="sim">Sim</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label" style="font-family: 'ItauText', sans-serif; font-weight: bold; font-size: 17px;">Holding de Consumo <span class="text-danger">*</span></label>
                                            <select class="form-control select-holding-consumo" name="holdingConsumo[]" style="font-family: 'ItauText', sans-serif; background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-main); font-size: 14px;" required>
                                                <option value="nenhuma">Nenhuma</option>
                                            </select>
                                        </div>
                                    </div>

                                    <!-- Linha 3 -->
                                    <div class="row">
                                        <div class="col-12 d-flex gap-3 justify-content-center mt-3">
                                            <button type="button" class="btn-associar" data-bs-toggle="modal" data-bs-target="#modalAssociarEmissor" data-system="OC3">
                                                <i class="bi bi-link"></i> Associar Emissor OC3
                                            </button>
                                            <button type="button" class="btn-associar" data-bs-toggle="modal" data-bs-target="#modalAssociarEmissor" data-system="CRIMS">
                                                <i class="bi bi-link"></i> Associar Emissor CRIMS
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Aba 2: Visualizar Grupo -->
                <div class="tab-pane fade" id="visualizar" role="tabpanel" aria-labelledby="visualizar-tab">
                    <form method="GET" action="{{ url_for('grupos_economicos.grupos_economicos_result') }}">
                        <div class="row align-items-end mb-4">
                            <div class="col-md-9">
                                <label for="selectGrupoFiltro" class="form-label" style="font-family: 'ItauText', sans-serif; font-weight: bold; font-size: 17px;">Selecione o Grupo Econômico</label>
                                <select class="form-select" name="grupo_id" id="selectGrupoFiltro" style="font-family: 'ItauText', sans-serif; background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-main); font-size: 14px; height: 42px;" required>
                                    <option value="" selected>Escolha um grupo...</option>
                                    {% for grupo in opcoes_grupos %}
                                    <option value="{{ loop.index }}">{{ grupo }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <button class="btn w-100" type="submit" id="btnPesquisarGrupo" style="background-color: var(--color-accent); border-color: var(--color-accent); color: white; font-weight: 600; font-family: 'ItauText', sans-serif; height: 42px;">
                                    <i class="bi bi-search me-2"></i>Pesquisar
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Associar Emissor -->
<div class="modal fade" id="modalAssociarEmissor" tabindex="-1" aria-labelledby="modalAssociarEmissorLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" style="background-color: var(--color-bg-secondary); border-radius: 12px; border: 1px solid var(--color-border);">
            <div class="modal-header" style="border-bottom: 1px solid var(--color-border);">
                <h5 class="modal-title" id="modalAssociarEmissorLabel" style="color: var(--color-accent); font-family: 'ItauDisplay', sans-serif; font-weight: 800;">Associar Códigos de Emissor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <!-- Search row -->
                <div class="row mb-4 align-items-end">
                    <div class="col-md-9">
                        <label class="form-label" style="font-family: 'ItauText', sans-serif; font-weight: bold; font-size: 17px;">Nome ou Código do Emissor</label>
                        <input type="text" id="inputPesquisaEmissor" class="form-control" placeholder="Digite para pesquisar..." style="font-family: 'ItauText', sans-serif; background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-main); font-size: 14px;">
                    </div>
                    <div class="col-md-3">
                        <button type="button" id="btnPesquisarEmissor" class="btn-associar w-100 justify-content-center">
                            <i class="bi bi-search"></i> Pesquisar
                        </button>
                    </div>
                </div>

                <!-- Results list -->
                <div id="resultadosPesquisaEmissor" style="display: none;">
                    <h6 style="color: var(--color-text-main); font-family: 'ItauText', sans-serif; font-weight: 700; margin-bottom: 16px;">Resultados da pesquisa:</h6>
                    <div class="list-group" id="listaEmissoresResultados" style="border-radius: 8px; overflow: hidden; border: 1px solid var(--color-border);">
                        <!-- Os resultados da API serão injetados aqui -->
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="border-top: 1px solid var(--color-border);">
                <button type="button" class="btn" data-bs-dismiss="modal" style="color: var(--color-text-main); font-family: 'ItauText', sans-serif; font-weight: 600;">Cancelar</button>
                <button type="button" class="btn" style="background: var(--color-accent); color: #fff; font-family: 'ItauText', sans-serif; font-weight: 700; border-radius: 8px; padding: 8px 24px;">Confirmar Associação</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('grupos_economicos.static', filename='js/grupos_economicos.js') }}"></script>
{% endblock %}
