{% extends 'base.html' %}

{% block title %}CRS - Grupos Econômicos{% endblock %}

{% block content %}

<div class="pagetitle mb-4">
  <h1 class="pagetitle-main">Grupos Econômicos</h1>
</div>

<div class="row justify-content-center mt-4">
  <div class="col-12 col-xl-10">
    <div class="action-card text-center">
      <h3 class="action-card-title">O que você deseja fazer?</h3>
      
      <div class="action-buttons-group">
        <a href="{{ url_for('grupos_economicos.consultar_grupo_economico') }}" class="btn-action-card">
          <i class="bi bi-search"></i>
          <span>Consultar Grupo Econômico</span>
        </a>

        <a href="{{ url_for('grupos_economicos.alterar_grupo_economico') }}" class="btn-action-card">
          <i class="bi bi-pencil-square"></i>
          <span>Alterar Grupo Econômico Existente</span>
        </a>

        <a href="{{ url_for('grupos_economicos.criar_grupo_economico') }}" class="btn-action-card">
          <i class="bi bi-plus-circle"></i>
          <span>Criar Novo Grupo Econômico</span>
        </a>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('grupos_economicos.static', filename='css/grupos_economicos.css') }}">
{% endblock %}
